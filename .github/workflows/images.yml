name: Build, test, and publish images

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Client tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build client test image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile.dev
          load: true
          tags: k8s-course-client:test
          cache-from: type=gha,scope=client-test
          cache-to: type=gha,mode=max,scope=client-test

      - name: Run client tests
        run: docker run --rm -e CI=true k8s-course-client:test npm test -- --watchAll=false --runInBand

  images:
    name: Build and check ${{ matrix.image }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: client
            image: client
          - context: server
            image: api
          - context: worker
            image: worker
          - context: nginx
            image: nginx
    env:
      IMAGE: krobbins99/k8s-course-${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          load: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Check production image
        env:
          COMPONENT: ${{ matrix.image }}
        run: |
          case "$COMPONENT" in
            client|nginx)
              docker run --rm --add-host client:127.0.0.1 --add-host api:127.0.0.1 \
                "$IMAGE:sha-$GITHUB_SHA" nginx -t
              ;;
            api|worker)
              docker run --rm --entrypoint sh "$IMAGE:sha-$GITHUB_SHA" \
                -c 'node --check index.js && node --check keys.js'
              ;;
          esac

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish checked image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
