services:
  client:
    image: krobbins99/k8s-course-client:latest
    mem_limit: 128m
    hostname: client
  server:
    image: krobbins99/k8s-course-api:latest
    mem_limit: 128m
    hostname: api
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
      - PGUSER=$PGUSER
      - PGHOST=$PGHOST
      - PGDATABASE=$PGDATABASE
      - PGPASSWORD=$PGPASSWORD
      - PGPORT=$PGPORT
  worker:
    image: krobbins99/k8s-course-worker:latest
    mem_limit: 128m
    hostname: worker
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
  nginx:
    image: krobbins99/k8s-course-nginx:latest
    mem_limit: 128m
    hostname: nginx
    ports:
      - '80:80'
